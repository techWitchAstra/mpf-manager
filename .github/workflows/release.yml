name: Release
on:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build
      - run: uv run pyinstaller packaging/mpf-manager.spec --noconfirm
      - name: Zip the app
        shell: bash
        run: cd dist && 7z a ../mpf-manager-${{ runner.os }}.zip . || zip -r ../mpf-manager-${{ runner.os }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: mpf-manager-${{ runner.os }}.zip
